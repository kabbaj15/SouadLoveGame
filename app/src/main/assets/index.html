<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#9d2569"><title>سعاد ❤️ عالم الحب والتحديات</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header><div class="heart">♥</div><h1>سعاد ❤️ عالم الحب والتحديات</h1><p>12 لعبة، قلبان، وتحديات لا تنتهي</p></header><section id="setup" class="panel"><h2>الدخول إلى عالم سعاد ❤️</h2><p class="muted">اتصل بمشروع Firebase للعب والدردشة مع شريكك.</p><button id="connect">اتصال وبدء اللعب</button><p id="setupMsg" class="msg"></p></section><section id="lobby" class="panel hidden"><h2>غرفة الحب الخاصة 🔐</h2><label>اسمك<input id="name" maxlength="24" placeholder="اسم اللاعب"></label><div class="actions"><button id="create">إنشاء غرفة جديدة</button><button id="join">الدخول بالكود</button></div><label>كود الغرفة<input id="code" maxlength="12" placeholder="12 حرفاً" dir="ltr"></label><p id="lobbyMsg" class="msg"></p></section><section id="room" class="panel hidden"><div class="roomtop"><div><small>كود الغرفة</small><strong id="roomCode"></strong></div><button id="copy" class="secondary">نسخ الكود</button></div><p id="players"></p><p id="status" class="muted"></p><div id="score" class="score"></div><div id="menu" class="games"></div><div id="game"></div><div id="result" class="hidden result"></div><section id="chatPanel" class="chat-panel" aria-label="دردشة الغرفة"><div class="chat-heading"><h2>💬 دردشة الحب الخاصة</h2><span id="chatStatus" class="muted">رسائلكم داخل الغرفة فقط</span></div><div id="chatMessages" class="chat-messages" role="log" aria-live="polite"><p class="muted">بداو الحديث ❤️</p></div><form id="chatForm" class="chat-form"><input id="chatInput" maxlength="500" placeholder="كتب رسالة لسعاد ❤️" aria-label="الرسالة" autocomplete="off" required><button id="chatSend" type="submit">إرسال 💌</button></form><p id="chatError" class="msg"></p></section><div class="actions"><button id="back" class="secondary hidden">العودة للألعاب</button><button id="leave" class="secondary">مغادرة الشاشة</button></div><p id="roomMsg" class="msg"></p></section><footer>صُنعت بحب لسعاد ❤️</footer></main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="config.js"></script><script src="app.js"></script></body></html>
